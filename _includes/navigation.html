<nav class="bg-gray-800 p-4">
    <div class="container mx-auto flex flex-row items-center justify-between">
      
      <!-- Navigation Links -->
      <div class="flex space-x-6 items-center">
        {% for item in site.data.navigation %}
        <a href="{{ item.link }}" 
          class="text-white py-2 px-4 rounded-md hover:border-2 hover:border-blue-400 transition duration-300 relative
          {% if page.url == item.link %}textborder-2 border-blue-400 bg-sky-400{% endif %}">
          
          {{ item.name }}
          
          <!-- Add the pinging dot only if the link is active -->
          {% if page.url == item.link %}
          <span class="absolute top-0 right-0 -mr-2 -mt-2">
            <span class="absolute inline-flex h-3 w-3 animate-ping rounded-full bg-sky-400 opacity-75"></span>
            <span class="relative inline-flex h-3 w-3 rounded-full bg-sky-500"></span>
          </span>
          {% endif %}
          
        </a>
        {% endfor %}
      </div>
    </div>
  </nav>
