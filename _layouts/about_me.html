<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    {% include navigation.html %}
    <header class="mb-8">Coś na początek</header>
    <article class="m-8">
      <div class="flex flex-row gap-6"> 
        <div class="flex-auto w-full sm:w-auto mb-6">
          {{ content }}
        </div>
        <details class="flex-none w-full sm:w-auto mb-6">
          <summary>Opis mnie</summary>
          <p>
            Przecież już wszystko wiesz
          </p>
        </details>
        <table class="flex-auto table-auto p-4 border border-gray-300 w-full sm:w-auto mb-6">
          <caption class="text-xl font-semibold mb-4">tabelka</caption>
          <thead>
            <tr class="bg-gray-100">
              <th scope="col" class="px-4 py-2 text-left">Pytanie</th>
              <th scope="col" class="px-4 py-2 text-left">Odpowiedź</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="px-4 py-2">Czy to tabela?</td>
              <td class="px-4 py-2">Tak</td>
            </tr>
            <tr>
              <td class="px-4 py-2">Czy ma sens?</td>
              <td class="px-4 py-2">Chyba <strong>nie</strong></td>
            </tr>
          </tbody>
        </table>
        <div>
          <p class="mb-4">
            Czy tabela ma sens?
          </p>
          <form class="w-full sm:w-auto">
            <label for="answer" class="block mb-2">
              Wybór:
            </label>
            <select name="answer" id="answer" class="block mb-4">
              <option value="tak">Tak</option>
              <option value="nie">Nie</option>
            </select>
            <label for="opis" class="block mb-2">
              Dlaczego?
            </label><br>
            <input type="text" id="opis" name="opis" class="block mb-4 w-full sm:w-auto" value=""><br>
            <button type="submit" class="mt-4">
              Prześlij
            </button>
          </form>

<label for="file">Procent osób uważającą ją za sensowną</label>
<progress id="file" value="32" max="100"> 1% </progress>
        </div>
      </div>
      <img class="hide" src="assets/mapimage" alt="map" usemap="#workmap" width="400" height="379" class="mt-8"> <!-- Added top margin to image -->

      <map name="workmap">
        <area shape="rect" coords="50,100,120,379" alt="Ja" href="about.html">
        <area shape="rect" coords="170,75,240,379" alt="Mój ojciec" href="/">
        <area shape="rect" coords="130,100,165,150" alt="Filmy" href="actors.html">
      </map>
    </article>
    <footer class="m-8">
      <p>
        Copyright © 2025
      </p>
    </footer>
  </body>
</html>
