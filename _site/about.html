<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <title>O mnie</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <nav class="bg-gray-800 p-4">
    <div class="container mx-auto flex flex-row items-center justify-between">
      
      <!-- Navigation Links -->
      <div class="flex space-x-6 items-center">
        
        <a href="/" 
          class="text-white py-2 px-4 rounded-md hover:border-2 hover:border-blue-400 transition duration-300 relative
          ">
          
          Strona główna
          
          <!-- Add the pinging dot only if the link is active -->
          
          
        </a>
        
        <a href="/about.html" 
          class="text-white py-2 px-4 rounded-md hover:border-2 hover:border-blue-400 transition duration-300 relative
          textborder-2 border-blue-400 bg-sky-400">
          
          O mnie
          
          <!-- Add the pinging dot only if the link is active -->
          
          <span class="absolute top-0 right-0 -mr-2 -mt-2">
            <span class="absolute inline-flex h-3 w-3 animate-ping rounded-full bg-sky-400 opacity-75"></span>
            <span class="relative inline-flex h-3 w-3 rounded-full bg-sky-500"></span>
          </span>
          
          
        </a>
        
        <a href="/actors.html" 
          class="text-white py-2 px-4 rounded-md hover:border-2 hover:border-blue-400 transition duration-300 relative
          ">
          
          Lista aktorów
          
          <!-- Add the pinging dot only if the link is active -->
          
          
        </a>
        
      </div>
    </div>
  </nav>
  
    <header class="mb-8">Coś na początek</header>
    <article class="m-8">
      <div class="flex flex-wrap gap-6"> <!-- Increased gap -->
        <div class="w-full sm:w-auto mb-6"> <!-- Added margin bottom to content -->
          <h1 id="o-mnie">O mnie</h1>

<p>Ta strona mówi o mnie, czego jak widać nie ma dużo.</p>

        </div>
        <details class="w-full sm:w-auto mb-6"> <!-- Added margin bottom -->
          <summary>Opis mnie</summary>
          <p>
            Przecież już wszystko wiesz
          </p>
        </details>
        <table class="table-auto p-4 border border-gray-300 w-full sm:w-auto mb-6"> <!-- Added margin bottom -->
          <caption class="text-xl font-semibold mb-4">tabelka</caption> <!-- Increased margin bottom on caption -->
          <thead>
            <tr class="bg-gray-100">
              <th scope="col" class="px-4 py-2 text-left">Pytanie</th>
              <th scope="col" class="px-4 py-2 text-left">Odpowiedź</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="px-4 py-2">Czy to tabela?</td>
              <td class="px-4 py-2">Tak</td>
            </tr>
            <tr>
              <td class="px-4 py-2">Czy ma sens?</td>
              <td class="px-4 py-2">Chyba <strong>nie</strong></td>
            </tr>
          </tbody>
        </table>
        <div>
          <p class="mb-4"> <!-- Added margin bottom to paragraph -->
            Czy tabela ma sens?
          </p>
          <form class="w-full sm:w-auto">
            <label for="answer" class="block mb-2"> <!-- Added margin bottom to label -->
              Wybór:
            </label>
            <select name="answer" id="answer" class="block mb-4"> <!-- Increased margin bottom -->
              <option value="tak">Tak</option>
              <option value="nie">Nie</option>
            </select>
            <label for="opis" class="block mb-2"> <!-- Added margin bottom to label -->
              Dlaczego?
            </label><br>
            <input type="text" id="opis" name="opis" class="block mb-4 w-full sm:w-auto" value=""><br> <!-- Increased margin bottom -->
            <button type="submit" class="mt-4"> <!-- Added top margin -->
              Prześlij
            </button>
          </form>
        </div>
      </div>
      <img class="hide" src="assets/mapimage" alt="map" usemap="#workmap" width="400" height="379" class="mt-8"> <!-- Added top margin to image -->

      <map name="workmap">
        <area shape="rect" coords="50,100,120,379" alt="Ja" href="about.html">
        <area shape="rect" coords="170,75,240,379" alt="Mój ojciec" href="/">
        <area shape="rect" coords="130,100,165,150" alt="Filmy" href="actors.html">
      </map>
    </article>
    <footer class="m-8">
      <p>
        Copyright © 2025
      </p>
    </footer>
  </body>
</html>
